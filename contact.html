<body>

    
    <nav class="navbar navbar-light bg-warning sticky-top">
        <div class="container">

            <a class="navbar-brand" href="index.html">ABC Toys</a>

            <div>
                <a class="nav-link d-inline-block" href="index.html">Home</a>
                <a class="nav-link d-inline-block" href="products.html">Products</a>
                <a class="nav-link d-inline-block" href="contact.html">Contact</a>

    <div class="container mt-5">

        <h1>Contact Us</h1>

        <p>Email: info@abctoys.com</p>

        <p>Phone: (123) 456-6789</p>

        <p>Address: pier 39, San Francisco, CA</p>

        <p>Facebook: www.facebook.com/abctoys</p>

    <h2 class="text-center mt-5">Send Us a Message</h2>

        
    <form>

            <div class="mb-3">
                <label for="name" class="form-label">Name:</label>
                <input type="text" class="form-control"
                id="name" placeholder="Enter your name">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" class="form-control"
                id="email" placeholder="Enter your email">
            </div>

            <div class="mb-3">
                <label for="message" class="form-label">Comments or Message:</label>
                <textarea class="form-control" id="message"
                rows="4" placeholder="Write your message"></textarea>
            </div>

            <button type="submit" class="btn btn-warning">Submit</button>

        </form>

    </div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
